services:
  paper:
    image: itzg/minecraft-server@sha256:efa878ddb49cf5251b2e5f2ad71b08fd2f7236c1f7907433f6697258b31d2ce4
    container_name: cloud-mc-benchmark-e0
    cpus: 2
    mem_limit: 5g
    memswap_limit: 5g
    environment:
      EULA: "TRUE"
      TYPE: PAPER
      VERSION: "26.2"
      PAPER_BUILD: "121"
      UID: "1000"
      GID: "1000"
      MEMORY: 4G
      SEED: "20260904"
      VIEW_DISTANCE: "6"
      SIMULATION_DISTANCE: "4"
      MAX_PLAYERS: "8"
      MODE: creative
      ALLOW_FLIGHT: "true"
      ONLINE_MODE: "false"
      ENFORCE_SECURE_PROFILE: "false"
      ENABLE_RCON: "true"
      RCON_PASSWORD: ${RCON_PASSWORD:?Set a private benchmark password}
    ports:
      - "127.0.0.1:25566:25565"
    volumes:
      - ${BENCH_DATA:?Set a fresh benchmark directory}:/data
    stop_grace_period: 120s
    restart: "no"
