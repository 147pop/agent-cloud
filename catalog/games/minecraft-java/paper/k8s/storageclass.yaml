# TES-58 requires Retain (not the local-path default class's Delete) so scaling
# the Deployment to zero can never delete the world, plus WaitForFirstConsumer
# so the PV binds to whichever node the Pod actually lands on.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: local-path-retain
provisioner: rancher.io/local-path
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
