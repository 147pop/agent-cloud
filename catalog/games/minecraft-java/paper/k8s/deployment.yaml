# Node label convention is TBD until the real game worker is labeled.
# Update the nodeSelector value below to match whatever label the operator
# applies to game-1 before first apply.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paper-e0-oracle
  namespace: cloud-minecraft-paper
spec:
  replicas: 1
  revisionHistoryLimit: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: paper-e0-oracle
  template:
    metadata:
      labels:
        app: paper-e0-oracle
    spec:
      terminationGracePeriodSeconds: 120
      serviceAccountName: paper-e0-oracle
      automountServiceAccountToken: false
      nodeSelector:
        cloud.example/role: game
      containers:
        - name: paper
          image: itzg/minecraft-server@sha256:efa878ddb49cf5251b2e5f2ad71b08fd2f7236c1f7907433f6697258b31d2ce4
          env:
            - name: EULA
              value: "TRUE"
            - name: TYPE
              value: PAPER
            - name: VERSION
              value: "26.2"
            - name: PAPER_BUILD
              value: "121"
            - name: MEMORY
              value: 2G
            - name: JVM_XX_OPTS
              value: "-XX:ActiveProcessorCount=2"
            - name: SEED
              value: "20260904"
            - name: UID
              value: "1000"
            - name: GID
              value: "1000"
            - name: VIEW_DISTANCE
              value: "6"
            - name: SIMULATION_DISTANCE
              value: "4"
            - name: MAX_PLAYERS
              value: "2"
            - name: MODE
              value: survival
            - name: DIFFICULTY
              value: normal
            - name: ENABLE_RCON
              value: "false"
            - name: CREATE_CONSOLE_IN_PIPE
              value: "true"
            - name: STOP_SERVER_ANNOUNCE_DELAY
              value: "0"
          ports:
            - name: minecraft
              containerPort: 25565
              hostPort: 25565
              protocol: TCP
          startupProbe:
            exec:
              command:
                - mc-monitor
                - status
                - --host
                - 127.0.0.1
                - --port
                - "25565"
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command:
                - mc-monitor
                - status
                - --host
                - 127.0.0.1
                - --port
                - "25565"
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "2"
              memory: 3Gi
            limits:
              cpu: "2"
              memory: 3Gi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: paper-e0-oracle-data
